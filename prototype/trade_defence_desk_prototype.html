<style>

function lev(a,b){var m=a.length,n=b.length,i,j,prev=[],cur=[];for(j=0;j<=n;j++)prev[j]=j;for(i=1;i<=m;i++){cur=[i];for(j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1))}prev=cur}return prev[n]}

function matchName(name,list){
  var best={tier:'none',score:0,row:null,annexName:''};var raw=name.trim().toLowerCase(),n1=norm1(name);
  for(var i=0;i<list.length;i++){var r=list[i];if(r.residual||/^(all )?other/i.test(r.names[0]))continue;
    for(var j=0;j<r.names.length;j++){var an=r.names[j],tier='none',sc=sim(n1,norm1(an));
      if(an.trim().toLowerCase()===raw){tier='exact';sc=1}
      else if(norm1(an)===n1){tier='normalised';sc=1}
      else if(sc>=0.88){tier='fuzzy'}
      var rank={exact:3,normalised:2,fuzzy:1,none:0};
      if(rank[tier]>rank[best.tier]||(rank[tier]===rank[best.tier]&&sc>best.score)){best={tier:tier,score:sc,row:r,annexName:an,note:(tier==='fuzzy'&&n1.replace(/ /g,'')===norm1(an).replace(/ /g,''))?'differs only in word breaks':''}}
    }}

}
function diffMarks(a,b){ /* mark characters of a (after despacing) not in same position class: simple common prefix/suffix diff */
  var x=a.toLowerCase(),y=b.toLowerCase(),p=0;while(p<x.length&&p<y.length&&x.charAt(p)===y.charAt(p))p++;
  var s=0;while(s<x.length-p&&s<y.length-p&&x.charAt(x.length-1-s)===y.charAt(y.length-1-s))s++;
  return esc(a.slice(0,p))+(a.length-p-s>0?'<span class="diff">'+esc(a.slice(p,a.length-s))+'</span>':'')+esc(a.slice(a.length-s));
}
function diffWords(a,b){ /* mark word-break differences by showing a with spaces made visible where annex differs */
  var A=a.toLowerCase().replace(/[^a-z0-9 ]+/g,'').split(/\s+/),B=b.toLowerCase().replace(/[^a-z0-9 ]+/g,'').split(/\s+/);
  var inB={};B.forEach(function(w){inB[w]=1});
  return a.split(/\s+/).map(function(w){var k=w.toLowerCase().replace(/[^a-z0-9]/g,'');return inB[k]?esc(w):'<span class="diff">'+esc(w)+'</span>'}).join(' ');
}

/* ===== provenance: size and SHA-256 are computed here, in the browser ===== */
var SHA={};
function actText(cid){return CASES[cid].paras.map(function(p){return p.no+' '+p.text}).join('\n')}
function actBytes(cid){try{return new TextEncoder().encode(actText(cid)).length}catch(e){return actText(cid).length}}
function computeSha(){
  CASE_IDS.forEach(function(cid){
    try{
      var sub=window.crypto&&window.crypto.subtle;if(!sub){SHA[cid]='n/a';return}
      sub.digest('SHA-256',new TextEncoder().encode(actText(cid))).then(function(buf){
        SHA[cid]=Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');paintSrc();
      },function(){SHA[cid]='n/a';paintSrc()});
    }catch(e){SHA[cid]='n/a'}
  });
}
function shaTxt(cid){var h=SHA[cid];return h&&h!=='n/a'?h.slice(0,12)+'...':(h==='n/a'?'hash not available here':'computing')}
function srcText(cid){return 'Example act text, read '+READ_AT[cid]+', '+(actBytes(cid)/1024).toFixed(1)+' KB, SHA-256 '+shaTxt(cid)+', supplier list v. 14 Nov 2026 (example)'}

function stageTable(cid,p){
  var c=CASES[cid],a=annexOf(cid),h='';
  if(!a)return '<div class="empty">This kind of act has no duty table. Nothing to read here.</div>';
  var n=Math.round(a.length*p),r=S.runs[cid],pause=r&&r.status==='needsyou';
  h+='<div class="eyebrow" style="margin-bottom:6px">Duty table, '+n+' of '+a.length+' rows read</div><div class="tw" style="max-height:300px;overflow:auto"><table class="t" style="min-width:460px"><thead><tr><th>#</th><th>Company</th><th>Rate</th><th>Code</th></tr></thead><tbody>';
  var show=a.length>8?a.slice(0,5).concat([null],a.slice(-1)):a;
  show.forEach(function(row){
    if(!row){h+='<tr><td colspan="4" class="muted">... '+(a.length-6)+' more rows</td></tr>';return}
    if(row.grouped&&p<.5){h+='<tr class="hlr"><td>'+row.n+'</td><td>'+row.names.map(esc).join('<br>')+'<span class="sub">One merged cell, two names</span></td><td class="num">'+esc(row.raw)+'</td><td class="mono">'+row.code+'</td></tr>'}
    else if(row.grouped){row.names.forEach(function(nm,j){h+='<tr class="hlr"><td>'+row.n+'.'+(j+1)+'</td><td>'+esc(nm)+'</td><td class="num">'+esc(row.raw)+'</td><td class="mono">'+row.code+'</td></tr>'})}
    else{var bad=row.state!=='code';h+='<tr'+(bad?' class="bad"':'')+'><td>'+row.n+'</td><td>'+esc(row.names[0])+'</td><td class="num">'+(bad?(row.state==='entered'?pct(row.rate)+' (entered by you)':'<b>'+esc(row.raw)+'</b>'+(row.state==='skipped'?' (unread)':'')):esc(row.raw))+'</td><td class="mono">'+row.code+'</td></tr>'}
  });
  h+='</tbody></table></div>';
  if(p>.5&&a.some(function(x){return x.grouped}))h+='<p class="sm t2" style="margin-top:8px">The merged cell now carries one rate and one additional code for both companies.</p>';
  var un=a.filter(function(x){return x.state==='unread'})[0];
  if(un&&pause)h+='<div class="your" data-tour="yourturn"><h4>Your turn: one cell in the duty table is unreadable</h4><p class="sm" style="margin-bottom:8px">Company: <b>'+esc(un.names[0])+'</b>. The raw cell:</p><span class="rawcell">'+esc(un.raw)+'</span>'+
    '<div class="fl" style="margin-top:12px"><label for="rowRate">Rate from the act\'s text</label></div><div class="lk"><input type="text" id="rowRate" data-input="rowrate" placeholder="for example 6.2" inputmode="decimal" aria-describedby="rowErr"><button type="button" class="btn primary" data-a="rowenter" id="rowGo" disabled>Use this rate</button><button type="button" class="btn" data-a="rowskip">Skip this row</button></div><div class="err" id="rowErr" role="status" aria-live="polite"></div>'+
    '<p class="sm t2">Skipping uses the "all other companies" rate of '+pct(a.filter(function(x){return x.residual})[0].rate)+' for the affected line and marks it as unread. The desk will not guess a rate.</p></div>';
  return h;
}

    {q:'And if it is extended for 12 months?',lo:t.cond12,hi:t.cond12,key:'cond:'+cid,meaning:'At the rate that may be extended, '+c.conditionalRate+' %. Not a forecast.',chip:'Only if extended',chipc:'amber'},

   {q:'What about a provisional period?',text:'Not applicable',meaning:'This duty is already definitive.',chip:'Not applicable',chipc:''},

function mmss(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60)}
var DUTY_NOTE='Extra anti-dumping duty only. Not normal customs duty, not import VAT.';
function rateStr(r){return r.rate==null?'No rate yet':(r.pending?pct(r.rateLo)+' or '+pct(r.rateHi):pct(r.rate))}
function rowLabel(r){
  var c=CASES[S.cur]||CASES.A,b;
  if(r.tier==='exact')b='Same name';
  else if(r.tier==='normalised')b='Same name, spelling differs';
  else if(r.tier==='fuzzy')b=r.dec==='confirm'?'Same entity, confirmed by you':(r.dec==='reject'?'Different entity, decided by you':'Probably the same entity: your decision');
  else if(r.tier==='none')b='Not named: "all other companies" rate';
  else b='In scope, no table of companies in this act';
  if(r.excluded)b=S.verified[S.cur+':'+r.excluded.field]?'Excluded on your reading':(r.tier==='none'?'Not named, but':'Same name, but')+' maybe excluded';
  return b;
}
function rowTrustLv(r){
  if(r.excluded)return S.verified[S.cur+':'+r.excluded.field]?'you':'need';
  if(r.flag==='entered by you')return 'you';
  if(r.unreadRow)return 'need';
  if(r.tier==='fuzzy')return r.dec?'you':'need';
  if(r.tier==='exact'||r.tier==='normalised'||r.tier==='none')return 'code';
  return null;
}
function rowChip(r){var lv=rowTrustLv(r);return lv?tchipStatic(lv,lv==='you'&&r.flag==='entered by you'?'Entered by you':null):''}
function noneReason(x){
  if(/^Goods/.test(x.reason))return 'A different product (product code '+cnf(x.line.cn)+')';

}

function tileField(cid,key){

function whatHappened(cid){
  var c=CASES[cid],p=cname(c.country),pr=c.product;
  if(c.type==='provisional')return 'The EU has put a temporary extra customs duty on '+pr+' from '+p+'. It applies from '+fd(c.dates.inForce)+'.';

  if(c.type==='initiation')return 'The EU has opened an investigation into subsidies on '+pr+' from '+p+'. No duty has been set yet.';

var tickTimer=null,lastTick=0;
function stepDur(i){var sp=SPEEDS[S.speed];return sp===0?120:STEPS[i].sec*1000/sp}

function onTick(){
  var now=performance.now(),dt=now-lastTick;lastTick=now;if(dt>400)dt=50;var any=false;
  Object.keys(S.runs).forEach(function(cid){var r=S.runs[cid];if(r.status!=='running')return;any=true;advance(cid,r,dt)});
  if(!any){clearInterval(tickTimer);tickTimer=null}
}

   case 'dtab':S.ui.dtab=a.getAttribute('data-v');render();break;
   case 'review':{if(S.reviewed[cid]){delete S.reviewed[cid];log('Sign-off undone',cid,'signed off','open');lsSet('reviewed',JSON.stringify(S.reviewed));render()}else{var nl=needs(cid);if(nl.length){S.ui.modal={kind:'reason',what:'review',cid:cid,n:nl.length,items:nl.map(function(x){return x.label}).join(', ')};renderModal()}else{doReview(cid,'');render()}}break}
   case 'proofgo':{S.ui.proofSec=a.getAttribute('data-v');S.ui.proofScroll=true;if(S.route==='proof'||S.route==='how')afterRender();else navigate('proof');break}
   case 'afilter':S.ui.auditFilter=a.getAttribute('data-v');render();break;
   case 'togglemaths':S.ui.mathsOpen=!S.ui.mathsOpen;render();break;
   case 'closemodal':S.ui.modal=null;renderModal();break;
   case 'scrimclose':if(tg===a){S.ui.modal=null;renderModal()}break;
   case 'accept':S.as.accepted=true;log('Assumptions accepted','suggested values','suggested','accepted');render();break;
   case 'theme':S.theme=S.theme==='system'?'light':(S.theme==='light'?'dark':'system');lsSet('theme',S.theme);render();break;
   case 'menu':S.ui.menu=!S.ui.menu;renderTop();renderTabbar();if(S.ui.menu){var mp=isPhone()?$('#tabbar .menu-pop'):$('#top .menu-pop'),fi=mp?$$('a,button',mp).filter(function(x){return x.offsetParent!==null})[0]:null;if(fi)fi.focus()}else focusMore();break;
   case 'reset':resetDemo();break;
   case 'shortcuts':S.ui.menu=false;S.ui.modal={kind:'shortcuts'};render();break;
   case 'tourstart':tourStart();break;
   case 'tournext':if(S.ui.tour&&!tourNeedsA(S.ui.tour.i+1))tourEnter(Math.min(TOUR.length-1,S.ui.tour.i+1));else if(S.ui.tour&&tourNeedsA(S.ui.tour.i+1))renderTour();break;
   case 'tourback':if(S.ui.tour)tourEnter(Math.max(0,S.ui.tour.i-1));break;
   case 'tourexit':tourExit();break;
   case 'tourdo':tourDo();break;
  }
});
function doReview(cid,reason){var nl=needs(cid);S.reviewed[cid]=true;S.reviewedAt=S.reviewedAt||{};S.reviewedAt[cid]=hhmm().slice(0,5);log(nl.length?'Signed off with open decisions':'Signed off as reviewed',cid+' '+CASES[cid].reg,'open',nl.length?plural(nl.length,'open decision')+': '+nl.map(function(x){return x.label}).join(', '):'no open decisions','signed off by '+USER.name+'; source: '+srcText(cid),reason);lsSet('reviewed',JSON.stringify(S.reviewed))}
function doLookup(w){
  var inp=$('#lk-'+w),name=((inp&&inp.value)||'').trim(),lerr=$('#lkerr-'+w);if(!name){if(lerr)lerr.textContent='Type a company name first.';if(inp)inp.focus();return}if(lerr)lerr.textContent='';
  var cid=S.cur&&CASES[S.cur].annex?S.cur:'A',an=annexOf(cid),m=matchName(name,an),resid=an.filter(function(r){return r.residual})[0];
  S.ui.lookup={cid:cid,name:name,m:m,resid:resid,t:hhmm()};S.ui.lookupText=name;
  log('Lookup by you',name,'',m.tier==='none'?'no match (closest '+m.annexName+', '+m.score.toFixed(2)+')':m.tier+' with table row '+m.row.n,'duty table of '+CASES[cid].reg);
  var lb=$('#lookupBox');if(lb&&lb.firstChild){lb.innerHTML=lookupWrap();lb.setAttribute('data-for',cid+S.ui.lookup.t)}
}
document.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-change');if(!k)return;touchClock();
  if(k==='cif'){var v=parseRateIn(t.value);if(v!=null&&v>=1&&v<=2){if(v!==S.as.cif)log('Assumption change','customs value factor',S.as.cif,v);S.as.cif=v}else toast('Enter a factor between 1 and 2, for example 1.08 or 1,08.');render()}
  else if(k==='issuer'){var ik=t.getAttribute('data-c')+':'+t.getAttribute('data-l'),pi=S.issuer[ik]||'';S.issuer[ik]=t.value.trim();if(pi!==S.issuer[ik])log('Invoice issuer noted','line '+t.getAttribute('data-l'),pi||'none',S.issuer[ik]||'none','Typed by you from the last invoice. The rate follows the producer or exporter named on the invoice.');var mc=t.closest('.issuer'),nt=mc&&mc.querySelector('.issuerNote');if(nt)nt.textContent=issuerNote(t.getAttribute('data-c'),S.issuer[ik])}
  else if(k==='labour'){S.as.showLabour=t.checked;render()}
  else if(k==='as-hourly'){var h=parseFloat(t.value);if(h>=0){log('Assumption change','hourly cost',S.as.hourly,h);S.as.hourly=h}render()}
  else if(k.indexOf('as-man-')===0){var id=k.slice(7),mv=parseFloat(t.value);if(mv>=0){log('Assumption change','minutes by hand case '+id,S.as.manual[id],mv);S.as.manual[id]=mv}render()}
  else if(k==='as-lead'){var lv=parseFloat(t.value);if(lv>=0){log('Assumption change','warning lead days',S.as.lead,lv);S.as.lead=lv}render()}
  else if(k==='as-months'){var mo=parseFloat(t.value);if(mo>=1&&mo<=12){log('Assumption change','provisional months',S.as.months,mo);S.as.months=mo}render()}
  else if(k==='missed'){S.as.missed=t.value;var o=$('#missedOut');if(o)o.innerHTML=(+t.value>0?'One avoided error a year is worth <b class="mono">'+fmt(+t.value)+' EUR</b>.':'<span class="muted">No claim until you type a figure.</span>')}
  else if(k==='supsel'){S.supSel[S.cur]=t.value;render()}
  else if(k==='evcase'){S.ui.evCase=t.value;render()}
  else if(k==='mathline'){S.ui.mathLine=t.value;render()}
  else if(k==='morecols'){S.ui.moreCols=t.checked;render()}
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-input');if(!k)return;
  if(k==='crate'){S.scn.cRate=parseFloat(t.value);S.scn.cOn=true;var v=$('#cRateV');if(v)v.textContent=S.scn.cRate+' %';var ar=$('#altres');if(ar)ar.innerHTML=cResult(S.cur);var mc=$('#mcards');if(mc)mc.innerHTML=cardsHtml(S.cur)}
  else if(k==='price'){S.scn.price=parseFloat(t.value);var p=$('#priceV');if(p)p.textContent='+'+S.scn.price+' %';var ar2=$('#altres');if(ar2)ar2.innerHTML=altResult(S.cur);var mc2=$('#mcards');if(mc2)mc2.innerHTML=cardsHtml(S.cur)}
  else if(k==='draft'){S.drafts[S.cur+':'+t.getAttribute('data-k')]=t.value;lsSet('drafts',JSON.stringify(S.drafts))}
  else if(k==='rowrate'){var b=$('#rowGo'),pv=parseRateIn(t.value);if(b)b.disabled=!(pv!=null&&pv>0&&pv<100);var er=$('#rowErr');if(er)er.textContent=''}
  else if(k==='reason'){var rb=$('#reasonGo');if(rb)rb.disabled=t.value.trim().length<5}
  else if(k==='tableq'){S.ui.tableQ=t.value;filterTable(t.value)}
  else if(k==='wordq'){var q=t.value.toLowerCase().trim();$$('#wl [data-q]').forEach(function(d){d.hidden=!!q&&d.getAttribute('data-q').indexOf(q)<0})}
});
document.addEventListener('toggle',function(e){
  var d=e.target;if(!d||!d.getAttribute)return;var g=d.getAttribute('data-grp');if(!g)return;

document.addEventListener('mouseover',function(e){

function trapTab(e,root){
  var f=$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])',root).filter(function(x){return x.offsetParent!==null});
  if(!f.length)return;var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  else if(!root.contains(document.activeElement)){e.preventDefault();first.focus()}
}
document.addEventListener('keydown',function(e){
  touchClock();lastAct=null;var tg=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName),k=e.key;
  if(k==='Tab'){var md=$('#mdl'),sb=$('#sheetbox');if(md)trapTab(e,md);else if(sb)trapTab(e,sb)}
  if(k==='Enter'&&tg.id&&/^lk-/.test(tg.id)){doLookup(tg.id.slice(3));return}
  if(k==='Enter'&&tg.id==='rowRate'){var b=$('#rowGo');if(b&&!b.disabled)b.click();return}
  if(k==='Enter'&&tg.getAttribute&&tg.getAttribute('role')==='button'&&tg.tagName==='TR'){tg.click();return}
  if(k==='Escape'){
    if(S.ui.modal){S.ui.modal=null;renderModal()}
    else if(S.ui.sheet||S.ui.pop)closeOverlay();
    else if(S.ui.menu){S.ui.menu=false;renderTop();renderTabbar();focusMore()}
    else if(S.ui.tour)tourExit();
    else if(S.ui.sel&&S.route==='read'){S.ui.sel=null;render()}
    return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  var inBtn=/^(BUTTON|A)$/.test(tg.tagName);
  if(k==='?'){S.ui.modal={kind:'shortcuts'};renderModal()}
  else if(k==='l'){startRun('A');navigate('run-a')}
  else if(k==='d')navigate('decisions');
  else if(k==='b')navigate('ledger');
  else if(k==='e'){S.ui.proofSec='evidence';S.ui.proofScroll=true;if(S.route==='proof'||S.route==='how')afterRender();else navigate('proof')}
  else if(k==='r'&&S.cur&&S.route==='case'){var bt=$('[data-a="review"]');if(bt)bt.click()}
  else if(k==='s'&&S.route==='run')skipRun(S.cur);
  else if(k===' '&&S.route==='run'&&!inBtn){e.preventDefault();var r=S.runs[S.cur];if(r&&r.status!=='done'&&r.status!=='idle')pauseToggle(S.cur);else if(!r||r.status==='idle'){startRun(S.cur);navigate('run-'+S.cur)}}
  else if(k==='End'&&S.route==='run')skipRun(S.cur);
  else if(k==='ArrowRight'&&S.route==='run'&&!inBtn)stepOnce(S.cur);
  else if((k==='j'||k==='k')&&S.route==='inbox'){var ids=visibleCases();if(!ids.length)return;var i=ids.indexOf(S.cur);i=k==='j'?Math.min(ids.length-1,i+1):Math.max(0,i<0?0:i-1);S.cur=ids[i];var cards=$$('.act[href]');if(cards[i])cards[i].focus()}
  else if(k==='Enter'&&S.route==='inbox'&&!inBtn&&S.cur&&runDone(S.cur))navigate('case-'+S.cur);
  else if((k==='['||k===']')&&S.route==='read'){var fs=fieldCheck(S.cur),ix=-1;fs.forEach(function(x,i2){if(selFieldId()===x.f.id)ix=i2});ix=k===']'?(ix+1)%fs.length:(ix<=0?fs.length-1:ix-1);S.ui.sel={type:'field',id:fs[ix].f.id};S.ui.rseg='facts';S.ui.needScroll=true;S.ui.flashField=fs[ix].f.id;render()}
  else if(k==='Enter'&&S.route==='read'&&S.ui.sel&&!inBtn){S.ui.needScroll=true;render()}
});
var wasPhone=null,resizeT=null;

  if(spyRaf)return;spyRaf=requestAnimationFrame(function(){spyRaf=0;if(S.ui.pop)placePop();if(S.route==='case')updateSpy();else if(S.route==='proof'||S.route==='how')updateProofSpy()});
},{passive:true});

  lsSet('drafts','{}');lsSet('reviewed','{}');lsSet('speed','x2');
  var th=S.theme;S=freshState();S.theme=th;S.speed='x2';clockBase=null;seedRuns();tourExit();
  S.ui.modal=null;closeOverlay();

(function(){
  var res=engineCheck(),bad=res.filter(function(x){return !x.ok});
  try{console.log('Trade Defence Desk engine check ('+res.length+' figures, EUR):\n'+res.map(function(x){return (x.ok?'ok   ':'DIFF ')+x.name+': engine '+fmt(x.engine)+', hand figure '+fmt(x.spec)}).join('\n'));
    if(bad.length)console.warn('Engine differs from hand figures in '+bad.length+' place(s). The page copy follows the engine.')}catch(e){}
  window.__tdd={engineCheck:res,state:function(){return S}};
})();
computeSha();
route();
